##############################################################
# File: /etc/nginx/sites-available/spring-proxy.conf
# Mô tả: Cấu hình Nginx Reverse Proxy cho Spring Boot App
# Tác giả: [Họ tên học viên]
# Lớp: [Mã lớp]
##############################################################

server {
    # Lắng nghe trên cổng 80 (HTTP mặc định)
    listen 80;

    # Tên máy chủ (dùng _ để khớp mọi hostname / IP)
    server_name _;

    # ──────────────────────────────────────────────────────
    # LOCATION 1: Static Content
    # Phục vụ trang tĩnh trực tiếp từ thư mục /var/www/html/
    # Khớp với đường dẫn gốc "/"
    # ──────────────────────────────────────────────────────
    location / {
        root   /var/www/html;
        index  index.html index.htm;

        # Thử tìm file → thư mục → trả 404 nếu không có
        try_files $uri $uri/ =404;
    }

    # ──────────────────────────────────────────────────────
    # LOCATION 2: API Reverse Proxy
    # Chuyển tiếp mọi request có tiền tố /api/ đến Spring Boot
    # đang chạy tại cổng 8082 trên localhost
    # ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8082/;

        # ── Proxy Headers ──────────────────────────────────
        # Chuyển tiếp Host gốc để backend nhận đúng hostname
        proxy_set_header Host              $host;

        # Địa chỉ IP thực của client
        proxy_set_header X-Real-IP         $remote_addr;

        # Chuỗi IP đầy đủ qua các proxy trung gian
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Giao thức ban đầu (http / https)
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Timeout Settings ───────────────────────────────
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # ── HTTP Version ───────────────────────────────────
        # Dùng HTTP/1.1 để hỗ trợ keep-alive với backend
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ──────────────────────────────────────────────────────
    # Trang lỗi tùy chỉnh
    # ──────────────────────────────────────────────────────
    error_page 404              /404.html;
    error_page 500 502 503 504  /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
